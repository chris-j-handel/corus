<title>Three diamonds, 1 to 25, by prefixes</title>
<desc>Twenty-five numbers going forward as three squares of nine, each turned as a diamond and joined tip to tip. Each number has its three prefixes, next, now, prior: co is me, bi is both, tri is all. Each is-or-is-not of the code is marked on the name it is on.</desc>
