<g><circle cx="160" cy="90" r="12" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/><text font-size="14" font-weight="500" fill="#085041" x="160" y="90" text-anchor="middle" dominant-baseline="central">5</text></g>
<g><rect x="98" y="128" width="24" height="24" rx="4" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/><text font-size="14" font-weight="500" fill="#712B13" x="110" y="140" text-anchor="middle" dominant-baseline="central">6</text></g>
