<g><circle cx="520" cy="80" r="12" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/><text font-size="14" font-weight="500" fill="#085041" x="520" y="80" text-anchor="middle" dominant-baseline="central">9</text></g>
<text font-size="12" fill="#5F5E5A" x="620" y="249">right point</text>
