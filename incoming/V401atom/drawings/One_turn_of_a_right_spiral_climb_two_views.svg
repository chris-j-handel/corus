<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="sans-serif">
<title>One turn of a right spiral climb, two views</title><desc>Nine numbers as one turn: each even number a step right across one face of a square, each odd number a step along. Seen along its line it is a square of four corners and four faces about a hole. Seen from its side, 1 is lowest, 9 highest, 3 a right point, 7 a left point and 5 its centre.</desc>
<line x1="168.5" y1="281.5" x2="198.0" y2="252.0" stroke="#888780" stroke-width="0.5"/>
<line x1="222.0" y1="228.0" x2="251.5" y2="198.5" stroke="#888780" stroke-width="0.5"/>
<line x1="251.5" y1="181.5" x2="222.0" y2="152.0" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="198.0" y1="128.0" x2="168.5" y2="98.5" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="151.5" y1="98.5" x2="122.0" y2="128.0" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="98.0" y1="152.0" x2="68.5" y2="181.5" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="68.5" y1="198.5" x2="98.0" y2="228.0" stroke="#888780" stroke-width="0.5"/>
<line x1="122.0" y1="252.0" x2="151.5" y2="281.5" stroke="#888780" stroke-width="0.5"/>
<circle cx="160" cy="190" r="14" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text font-size="12" fill="#5F5E5A" x="160" y="166" text-anchor="middle">a hole</text>
<g><circle cx="160" cy="290" r="12" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/><text font-size="14" font-weight="500" fill="#085041" x="160" y="290" text-anchor="middle" dominant-baseline="central">1</text></g>
<g><rect x="198" y="228" width="24" height="24" rx="4" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/><text font-size="14" font-weight="500" fill="#712B13" x="210" y="240" text-anchor="middle" dominant-baseline="central">2</text></g>
<g><circle cx="260" cy="190" r="12" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/><text font-size="14" font-weight="500" fill="#085041" x="260" y="190" text-anchor="middle" dominant-baseline="central">3</text></g>
